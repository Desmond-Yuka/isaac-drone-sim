[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-drone-sim"
version = "0.2.0"
description = "ARL-Robot-1 motion-control architecture for the local Isaac Lab / PhysX stack"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.6", "matplotlib>=3.5"]
plot = ["matplotlib>=3.5"]
usd = ["usd-core>=25.0"]
video = ["imageio-ffmpeg>=0.6"]

[tool.setuptools.packages.find]
include = ["isaac_drone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long closed-loop regressions (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["IsaacLab", "runs", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E731",    # small lambdas are used for figure/factory tables
    "SIM108",  # ternaries are not always clearer
    "RUF001", "RUF002", "RUF003",  # Chinese/Unicode punctuation and SI symbols in text
    "B905",    # zip() strictness is checked explicitly where lengths can differ
    "RUF005",  # false positives on NumPy: array + [..] is element-wise addition, not concatenation
    "SIM105",  # explicit try/except/pass reads fine in cleanup paths
]

[tool.ruff.format]
# `ruff format` is the project style (black-compatible, 120 columns).

[tool.ruff.lint.isort]
known-first-party = ["isaac_drone"]
